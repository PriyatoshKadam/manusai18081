services:
  - type: web
    name: ga4fix
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Set this to the Supabase Postgres connection string in Render.
      # Use the Supabase session pooler for the web service or the direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: PG_SSL
        value: "true"
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: PG_CA_CERT
        sync: false
      - key: ALLOW_RENDER_SELF_SIGNED_TLS
        value: "true"
      - key: ALLOW_INSECURE_DB_TLS
        value: "false"
      - key: ALLOW_INSECURE_DEV_AUTH
        value: "false"
      - key: NEXT_PUBLIC_MONITOR_ORIGIN
        value: https://monitoring-0jsu.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GTM_CLIENT_ID
        sync: false
      - key: GTM_CLIENT_SECRET
        sync: false
      - key: GTM_REDIRECT_URI
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.9.0"
